const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const tob64=u=>{let s='';for(const x of new Uint8Array(u))s+=String.fromCharCode(x);return btoa(s)};
async function open_(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const c=b64(CT);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:c.slice(0,12)},k,c.slice(12));
 sessionStorage.setItem('mk',tob64(raw));const h=new TextDecoder().decode(pt);document.open();document.write(h);document.close();}
async function derive(pw){const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(SALT),iterations:IT,hash:'SHA-256'},bk,256);}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const E=document.getElementById('e'),B=document.getElementById('b');
 E.textContent='';B.textContent='Sprawdzam…';B.disabled=true;
 try{await open_(await derive(document.getElementById('p').value));}catch(x){E.textContent='Nieprawidłowe hasło';B.textContent='Otwórz';B.disabled=false;}};
const s=sessionStorage.getItem('mk');if(s)addEventListener('load',()=>open_(b64(s)).catch(()=>sessionStorage.removeItem('mk')));
